<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline – Ernährungstagebuch</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #eef5ff, #f3f7fb);
        color: #122033;
      }
      .card {
        width: min(90vw, 560px);
        background: white;
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 18px 35px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
      }
      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Du bist offline</h1>
      <p>
        Die App wurde bereits zwischengespeichert und kann im Moment ohne Internetzugang weiter verwendet werden.
        Sobald die Verbindung wiederhergestellt ist, synchronisiert sie automatisch.
      </p>
    </div>
  </body>
</html>
