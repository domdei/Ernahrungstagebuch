<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ernährungstagebuch" />
    <meta
      name="description"
      content="Persönliches Ernährungstagebuch mit Rotationswarnungen und PWA-Unterstützung."
    />
    <title>Ernährungstagebuch</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=1.0.26" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ernaehrungstagebuch-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Persönlicher Tracker</p>
          <h1>Ernährungstagebuch</h1>
        </div>
        <div class="topbar-actions">
          <button id="themeToggle" class="icon-button" type="button" aria-label="Nachtmodus aktivieren" title="Nachtmodus aktivieren">☾</button>
          <button id="settingsButton" class="icon-button" type="button" aria-label="Einstellungen & Backup" title="Einstellungen & Backup">⚙</button>
          <button id="installButton" class="secondary-button hidden" type="button" aria-label="App installieren">
            Installieren
          </button>
        </div>
      </header>

      <main class="container">
        <section class="panel form-panel">
          <div class="field-grid">
            <div class="date-field-wrap">
              <label class="field">
                <span>Datum</span>
                <input id="entryDate" type="date" />
              </label>
              <button id="todayButton" class="icon-button" type="button" aria-label="Auf heute setzen" title="Auf heute setzen">↺</button>
            </div>

            <div class="category-field-wrap">
              <div class="field category-field">
                <label for="searchCategory">Kategorie</label>
                <div class="category-input-inner">
                  <select id="searchCategory">
                    <option value="all">Alle</option>
                  </select>
                  <button
                    id="categoryClearButton"
                    class="search-clear-button category-clear-button hidden"
                    type="button"
                    aria-label="Kategorie-Filter zurücksetzen"
                    title="Kategorie auf Alle zurücksetzen"
                  >
                    ✕
                  </button>
                </div>
              </div>
              <button id="onlyFreshGreenFoods" class="icon-button green-filter-button" type="button" aria-pressed="false" aria-label="Nur grüne, noch nicht erfasste Lebensmittel" title="Nur grüne, noch nicht erfasste Lebensmittel">🟢</button>
            </div>

            <div class="field search-field" id="searchField">
              <label id="foodSearchLabel" for="foodSearch">Lebensmittel</label>
              <div class="search-input-wrap">
                <button
                  id="searchCloseButton"
                  class="icon-button search-close-button"
                  type="button"
                  aria-label="Suche schließen"
                  title="Suche schließen"
                >
                  ←
                </button>
                <div class="search-input-inner">
                  <input
                    id="foodSearch"
                    type="text"
                    autocomplete="off"
                    placeholder="Suche nach einem Lebensmittel..."
                  />
                  <button
                    id="searchClearButton"
                    class="search-clear-button hidden"
                    type="button"
                    aria-label="Eingabe löschen"
                    title="Eingabe löschen"
                  >
                    ✕
                  </button>
                </div>
                <button
                  id="searchDoneButton"
                  class="search-done-button"
                  type="button"
                  aria-label="Auswahl abschließen"
                  title="Auswahl abschließen"
                >
                  Fertig
                </button>
              </div>
              <div id="overlaySelectedFoods" class="overlay-selected-foods hidden" aria-live="polite"></div>
              <div id="suggestions" class="suggestions" aria-live="polite"></div>
            </div>
          </div>

          <div id="selectedFoods" class="selected-foods" aria-live="polite"></div>
          <div id="selectionWarnings" class="selection-warnings" aria-live="polite"></div>

          <button id="saveButton" class="primary-button wide-button" type="button">Einträge speichern</button>
        </section>

        <section class="panel overview-panel">
          <div class="section-header">
            <h2>Verlauf</h2>
            <div class="history-toolbar">
              <button
                id="historyModeToggle"
                class="icon-button small-icon-button"
                type="button"
                aria-pressed="false"
                aria-label="Historie filtern"
                title="Historie filtern"
              >
                🔍
              </button>
              <button
                id="historyDeleteToggle"
                class="icon-button small-icon-button"
                type="button"
                aria-pressed="false"
                aria-label="Löschmodus aktivieren"
                title="Löschmodus aktivieren"
              >
                🗑️
              </button>
            </div>
          </div>

          <div id="historyFilters" class="filter-row hidden">
            <label>
              <span>Datum von</span>
              <input id="filterFromDate" type="date" />
            </label>
            <label>
              <span>Datum bis</span>
              <input id="filterToDate" type="date" />
            </label>
            <label>
              <span>Kategorie</span>
              <select id="filterCategory">
                <option value="all">Alle</option>
              </select>
            </label>
            <label>
              <span>Status</span>
              <select id="filterStatus">
                <option value="all">Alle</option>
                <option value="green">Grün</option>
                <option value="orange">Orange</option>
                <option value="red">Rot</option>
              </select>
            </label>
          </div>

          <div id="historyList" class="history-list"></div>
        </section>
      </main>
    </div>

    <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="settingsModalTitle">Einstellungen &amp; Backup</h3>
          <button id="settingsCloseButton" class="icon-button small-icon-button modal-close-btn" type="button" aria-label="Schließen" title="Schließen">✕</button>
        </div>
        <div class="settings-content">
          <div class="settings-section">
            <h4>Datensicherung</h4>
            <div class="export-actions">
              <button id="exportJsonButton" class="secondary-button" type="button">Backup speichern (Export)</button>
              <label class="import-label">
                <span>Backup importieren</span>
                <input id="importFile" type="file" accept=".json" />
              </label>
            </div>
          </div>
          <div class="settings-section">
            <h4>Speicherstatus &amp; Info</h4>
            <div class="version-row">
              <span class="version-label">Browser-Speicher:</span>
              <strong id="storageStatus">Standard</strong>
            </div>
            <div class="version-row">
              <span class="version-label">Version:</span>
              <strong id="appVersion">1.0.0</strong>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="importModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
      <div class="modal-card">
        <h3 id="importModalTitle">Backup importieren</h3>
        <p id="importModalText" class="modal-description"></p>
        <div class="modal-actions">
          <button id="importMergeButton" class="modal-btn modal-btn-option" type="button">
            <strong>Ergänzen</strong>
            <small>Neue Einträge hinzufügen, Bestehendes behalten</small>
          </button>
          <button id="importReplaceButton" class="modal-btn modal-btn-option" type="button">
            <strong>Ersetzen</strong>
            <small>Alle bisherigen Einträge durch das Backup ersetzen</small>
          </button>
          <button id="importCancelButton" class="ghost-button modal-btn modal-btn-cancel" type="button">
            <strong>Abbrechen</strong>
          </button>
        </div>
      </div>
    </div>

    <noscript>
      <div class="noscript-banner">JavaScript ist erforderlich, damit die App korrekt funktioniert.</div>
    </noscript>

    <script src="./app.js?v=1.0.26" defer></script>
  </body>
</html>
