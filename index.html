<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ernährungstagebuch" />
    <meta
      name="description"
      content="Persönliches Ernährungstagebuch mit Rotationswarnungen und PWA-Unterstützung."
    />
    <title>Ernährungstagebuch</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=1.0.2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Persönlicher Tracker</p>
          <h1>Ernährungstagebuch</h1>
        </div>
        <button id="installButton" class="secondary-button hidden" type="button" aria-label="App installieren">
          Installieren
        </button>
      </header>

      <main class="container">
        <section class="panel form-panel">
          <div class="field-grid">
            <div class="date-field-wrap">
              <label class="field">
                <span>Datum</span>
                <input id="entryDate" type="date" />
              </label>
              <button id="todayButton" class="mini-button" type="button" aria-label="Auf heute setzen">Heute</button>
            </div>

            <label class="field">
              <span>Kategorie</span>
              <select id="searchCategory">
                <option value="all">Alle</option>
              </select>
            </label>

            <label class="subtle-toggle" for="onlyFreshGreenFoods">
              <input id="onlyFreshGreenFoods" type="checkbox" />
              <span>Nur grüne, noch nicht erfasst</span>
            </label>

            <div class="field search-field">
              <label for="foodSearch">Lebensmittel</label>
              <input
                id="foodSearch"
                type="text"
                autocomplete="off"
                placeholder="Suche nach einem Lebensmittel..."
              />
              <div id="suggestions" class="suggestions" aria-live="polite"></div>
            </div>
          </div>

          <div id="selectedFoods" class="selected-foods" aria-live="polite"></div>
          <div id="selectionWarnings" class="selection-warnings" aria-live="polite"></div>

          <button id="saveButton" class="primary-button wide-button" type="button">Einträge speichern</button>
        </section>

        <section class="panel overview-panel">
          <div class="section-header">
            <h2>Verlauf</h2>
            <div class="history-toolbar">
              <button id="historyModeToggle" class="ghost-button" type="button">Historie filtern</button>
              <button id="historyDeleteToggle" class="ghost-button" type="button">Löschmodus</button>
            </div>
          </div>

          <div id="historyFilters" class="filter-row hidden">
            <label>
              <span>Datum von</span>
              <input id="filterFromDate" type="date" />
            </label>
            <label>
              <span>Datum bis</span>
              <input id="filterToDate" type="date" />
            </label>
            <label>
              <span>Kategorie</span>
              <select id="filterCategory">
                <option value="all">Alle</option>
              </select>
            </label>
            <label>
              <span>Status</span>
              <select id="filterStatus">
                <option value="all">Alle</option>
                <option value="green">Grün</option>
                <option value="orange">Orange</option>
                <option value="red">Rot</option>
              </select>
            </label>
          </div>

          <div id="historyList" class="history-list"></div>
        </section>

        <section class="panel summary-panel">
          <div class="summary-grid">
            <div>
              <h2>Export & Import</h2>
              <div class="export-actions">
                <button id="exportJsonButton" class="secondary-button" type="button">Backup speichern</button>
                <label class="import-label">
                  <span>Backup importieren</span>
                  <input id="importFile" type="file" accept=".json,.csv" />
                </label>
              </div>
            </div>
          </div>

          <div class="version-panel">
            <div class="version-row">
              <span class="version-label">Version</span>
              <strong id="appVersion">1.0.0</strong>
            </div>
            <div class="version-actions">
              <button id="checkForUpdateButton" class="ghost-button" type="button">Update prüfen</button>
              <span id="updateStatus" class="update-status">Aktuell</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <noscript>
      <div class="noscript-banner">JavaScript ist erforderlich, damit die App korrekt funktioniert.</div>
    </noscript>

    <script src="./app.js?v=1.0.2" defer></script>
  </body>
</html>
